            </div>
            <div class="contactForm__element">
                <label for="Mail" class="h3">Adresse mail:*</label>
                <input type="email" name="Mail" id="Mail" placeholder="Adresse mail" required>
            </div>
            <div class="contactForm__element">
                <label for="Message" class="h3">Message:</label>
                <textarea name="Message" id="Message" placeholder="Message optionnel"></textarea>
            </div>
            <button type="submit" class="envoyer NAV">Envoyer</button>
        </form>
